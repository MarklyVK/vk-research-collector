x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    image: vk-research-postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vk_research}
      POSTGRES_USER: ${POSTGRES_USER:-vk_collector}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_development_only}
      POSTGRES_READER_USER: ${POSTGRES_READER_USER:-vk_reader}
      POSTGRES_READER_PASSWORD: ${POSTGRES_READER_PASSWORD:-local_reader_only}
      TZ: UTC
      PGTZ: UTC
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=20
      - -c
      - effective_cache_size=384MB
    ports:
      - "${POSTGRES_BIND_ADDRESS:-0.0.0.0}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    mem_limit: 512m
    cpus: 0.75
    logging: *default-logging

  collector:
    build:
      context: .
    init: true
    environment: &collector-environment
      APP_ENV: ${APP_ENV:-production}
      RUN_INTEGRATION_TESTS: ${RUN_INTEGRATION_TESTS:-1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TZ: UTC
      VK_API_VERSION: ${VK_API_VERSION:-5.199}
      VK_TOKENS_FILE: ${VK_TOKENS_FILE:-/run/secrets/vk_tokens.txt}
      VK_REQUEST_TIMEOUT_SECONDS: ${VK_REQUEST_TIMEOUT_SECONDS:-30}
      VK_MAX_CONCURRENCY: ${VK_MAX_CONCURRENCY:-3}
      VK_PER_TOKEN_RPS: ${VK_PER_TOKEN_RPS:-2.5}
      CLASSIFICATION_BATCH_SIZE: ${CLASSIFICATION_BATCH_SIZE:-100}
      EXPORT_DIR: ${EXPORT_DIR:-/app/exports/classification}
      POSTGRES_DB: ${POSTGRES_DB:-vk_research}
      POSTGRES_USER: ${POSTGRES_USER:-vk_collector}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_development_only}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      DISK_WARNING_PERCENT: ${DISK_WARNING_PERCENT:-85}
      DISK_STOP_PERCENT: ${DISK_STOP_PERCENT:-95}
      COLLECTION_WORKER_ID: ${COLLECTION_WORKER_ID:-collector-1}
      COLLECTION_MAX_CONCURRENCY: ${COLLECTION_MAX_CONCURRENCY:-3}
      COLLECTION_JOB_LEASE_SECONDS: ${COLLECTION_JOB_LEASE_SECONDS:-300}
      COLLECTION_JOB_HEARTBEAT_SECONDS: ${COLLECTION_JOB_HEARTBEAT_SECONDS:-60}
      COLLECTION_IDLE_SLEEP_SECONDS: ${COLLECTION_IDLE_SLEEP_SECONDS:-5}
      COLLECTION_POSTS_ENABLED: ${COLLECTION_POSTS_ENABLED:-true}
      COLLECTION_POSTS_MAX_PER_GROUP: ${COLLECTION_POSTS_MAX_PER_GROUP:-100}
      COLLECTION_POSTS_PAGE_SIZE: ${COLLECTION_POSTS_PAGE_SIZE:-100}
      COLLECTION_POSTS_INCLUDE_PINNED: ${COLLECTION_POSTS_INCLUDE_PINNED:-true}
      COLLECTION_POSTS_STOP_AT_DATE: ${COLLECTION_POSTS_STOP_AT_DATE:-}
      COLLECTION_MEMBERS_ENABLED: ${COLLECTION_MEMBERS_ENABLED:-true}
      COLLECTION_MEMBERS_MAX_PER_GROUP: ${COLLECTION_MEMBERS_MAX_PER_GROUP:-200}
      COLLECTION_MEMBERS_PAGE_SIZE: ${COLLECTION_MEMBERS_PAGE_SIZE:-1000}
      COLLECTION_USERS_ENABLED: ${COLLECTION_USERS_ENABLED:-true}
      COLLECTION_USER_PROFILE_TTL_DAYS: ${COLLECTION_USER_PROFILE_TTL_DAYS:-30}
      COLLECTION_USER_BATCH_SIZE: ${COLLECTION_USER_BATCH_SIZE:-1000}
      COLLECTION_SUBSCRIPTIONS_ENABLED: ${COLLECTION_SUBSCRIPTIONS_ENABLED:-false}
      COLLECTION_SUBSCRIPTIONS_MAX_PER_USER: ${COLLECTION_SUBSCRIPTIONS_MAX_PER_USER:-}
      COLLECTION_SUBSCRIPTIONS_PAGE_SIZE: ${COLLECTION_SUBSCRIPTIONS_PAGE_SIZE:-500}
      COLLECTION_PILOT_SEED: ${COLLECTION_PILOT_SEED:-20260728}
      COLLECTION_PILOT_GROUPS_PER_CATEGORY: ${COLLECTION_PILOT_GROUPS_PER_CATEGORY:-10}
      COLLECTION_EXPORT_DIR: ${COLLECTION_EXPORT_DIR:-/app/exports/stage2-pilot}
    volumes: &collector-volumes
      - ./config:/app/config:ro
      - ./exports:/app/exports
      - ./secrets/vk_tokens.txt:/run/secrets/vk_tokens.txt:ro
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 384m
    cpus: 0.75
    logging: *default-logging

  collector-worker:
    build:
      context: .
    init: true
    command: ["collection", "worker"]
    restart: unless-stopped
    environment:
      <<: *collector-environment
      COLLECTION_WORKER_ID: ${COLLECTION_WORKER_ID:-collector-worker-1}
    volumes: *collector-volumes
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 384m
    cpus: 0.75
    logging: *default-logging

volumes:
  postgres_data:
