services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    pull_policy: missing
    command:
      - postgres
      - -c
      - shared_buffers=768MB
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=40
      - -c
      - synchronous_commit=off
      - -c
      - checkpoint_completion_target=0.9
    mem_limit: 1536m
    cpus: 1.0
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-init-readonly.sh:/docker-entrypoint-initdb.d/20-readonly.sh:ro

  collector:
    image: ${COLLECTOR_IMAGE:?COLLECTOR_IMAGE must contain an immutable sha tag}
    pull_policy: never
    mem_limit: 1024m
    cpus: 1.0
    volumes:
      - ./config:/app/config:ro
      - ./exports:/app/exports
      - ./backups:/app/backups:ro
      - ./secrets/vk_tokens.txt:/run/secrets/vk_tokens.txt:ro

  collector-worker:
    image: ${COLLECTOR_IMAGE:?COLLECTOR_IMAGE must contain an immutable sha tag}
    pull_policy: never
    restart: unless-stopped
    mem_limit: 1024m
    cpus: 1.0
    volumes:
      - ./config:/app/config:ro
      - ./exports:/app/exports
      - ./backups:/app/backups:ro
      - ./secrets/vk_tokens.txt:/run/secrets/vk_tokens.txt:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import pathlib,sys;
          sys.exit(0 if any(b'collection\x00worker' in p.read_bytes()
          for p in pathlib.Path('/proc').glob('[0-9]*/cmdline')) else 1)
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-vk_research_postgres_data}
