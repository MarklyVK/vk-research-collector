name: Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    name: Повторная обязательная проверка
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vk_research_test
          POSTGRES_USER: vk_collector
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vk_collector -d vk_research_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      RUN_INTEGRATION_TESTS: "1"
      DATABASE_URL: postgresql+asyncpg://vk_collector:test_password@localhost:5432/vk_research_test
      POSTGRES_DB: vk_research_test
      POSTGRES_USER: vk_collector
      POSTGRES_PASSWORD: test_password
      POSTGRES_READER_PASSWORD: test_reader_password
      VK_TOKENS_FILE: /tmp/fake-vk-tokens-not-required
      TELEGRAM_ENABLED: "false"
    steps:
      - name: Получить exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Разрешить только commit из main
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo 'Production workflow разрешён только для main.' >&2
            exit 1
          fi
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Установить Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Установить зависимости
        run: python -m pip install -e ".[dev]"
      - name: Проверить код, миграции и тесты
        run: |
          ruff check .
          ruff format --check .
          mypy src
          alembic upgrade head
          alembic check
          pytest -q
      - name: Проверить и собрать Compose
        run: |
          mkdir -p secrets exports
          : > secrets/vk_tokens.txt
          docker compose config --quiet
          docker compose build

  build-image:
    name: Опубликовать production image
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - name: Получить exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Вычислить имя неизменяемого image
        id: image
        shell: bash
        run: |
          set -Eeuo pipefail
          repository="${GITHUB_REPOSITORY,,}"
          echo "name=ghcr.io/${repository}/collector" >> "$GITHUB_OUTPUT"
          echo "ref=ghcr.io/${repository}/collector:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Войти в GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Настроить Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Сформировать tags и OCI labels
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=main
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.image.outputs.created }}
      - name: Собрать и отправить image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
