name: Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    name: Повторная обязательная проверка
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vk_research_test
          POSTGRES_USER: vk_collector
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vk_collector -d vk_research_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      RUN_INTEGRATION_TESTS: "1"
      DATABASE_URL: postgresql+asyncpg://vk_collector:test_password@localhost:5432/vk_research_test
      POSTGRES_DB: vk_research_test
      POSTGRES_USER: vk_collector
      POSTGRES_PASSWORD: test_password
      POSTGRES_READER_PASSWORD: test_reader_password
      VK_TOKENS_FILE: /tmp/fake-vk-tokens-not-required
      TELEGRAM_ENABLED: "false"
    steps:
      - name: Получить exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Разрешить только commit из main
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo 'Production workflow разрешён только для main.' >&2
            exit 1
          fi
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Установить Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Установить зависимости
        run: python -m pip install -e ".[dev]"
      - name: Проверить код, миграции и тесты
        run: |
          ruff check .
          ruff format --check .
          mypy src
          alembic upgrade head
          alembic check
          pytest -q
      - name: Проверить и собрать Compose
        run: |
          mkdir -p secrets exports
          : > secrets/vk_tokens.txt
          docker compose config --quiet
          docker compose build

  build-image:
    name: Опубликовать production image
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.ref }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Получить exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Вычислить имя неизменяемого image
        id: image
        shell: bash
        run: |
          set -Eeuo pipefail
          repository="${GITHUB_REPOSITORY,,}"
          {
            echo "name=ghcr.io/${repository}/collector"
            echo "ref=ghcr.io/${repository}/collector:sha-${GITHUB_SHA}"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
      - name: Войти в GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Настроить Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Сформировать tags и OCI labels
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=main
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.image.outputs.created }}
      - name: Собрать и отправить image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Развернуть на production runner
    needs: [quality, build-image]
    runs-on: [self-hosted, linux, x64, production, vk-collector]
    permissions:
      contents: read
      packages: read
    environment:
      name: production
    outputs:
      backup: ${{ steps.result.outputs.backup }}
      previous-image: ${{ steps.result.outputs.previous-image }}
      revision: ${{ steps.result.outputs.revision }}
      worker-state: ${{ steps.result.outputs.worker-state }}
      postgres-state: ${{ steps.result.outputs.postgres-state }}
      run-id: ${{ steps.result.outputs.run-id }}
      completed: ${{ steps.result.outputs.completed }}
      image-digest: ${{ steps.result.outputs.image-digest }}
      duration-seconds: ${{ steps.result.outputs.duration-seconds }}
    steps:
      - name: Получить проверенный exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Повторно подтвердить принадлежность commit ветке main
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Войти в GHCR только для чтения
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backup, миграции, обновление и production verify
        env:
          COLLECTOR_IMAGE: ${{ needs.build-image.outputs.image }}
          COLLECTOR_IMAGE_DIGEST: ${{ needs.build-image.outputs.digest }}
          DEPLOY_GIT_SHA: ${{ github.sha }}
          DEPLOY_ROOT: /opt/vk-research-collector
        run: >-
          bash scripts/deploy-production.sh
          --source-dir "$GITHUB_WORKSPACE"
          --deploy-dir "$DEPLOY_ROOT"
          --image "$COLLECTOR_IMAGE"
          --image-digest "$COLLECTOR_IMAGE_DIGEST"
          --git-sha "$DEPLOY_GIT_SHA"
      - name: Передать безопасные результаты следующему job
        id: result
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          report=/opt/vk-research-collector/.deploy/last-deployment.env
          test -f "$report" || exit 0
          while IFS='=' read -r key value; do
            case "$key" in
              BACKUP_PATH) echo "backup=$value" >> "$GITHUB_OUTPUT" ;;
              PREVIOUS_IMAGE) echo "previous-image=$value" >> "$GITHUB_OUTPUT" ;;
              ALEMBIC_REVISION) echo "revision=$value" >> "$GITHUB_OUTPUT" ;;
              WORKER_STATE) echo "worker-state=$value" >> "$GITHUB_OUTPUT" ;;
              POSTGRES_STATE) echo "postgres-state=$value" >> "$GITHUB_OUTPUT" ;;
              RUN_ID) echo "run-id=$value" >> "$GITHUB_OUTPUT" ;;
              COMPLETED) echo "completed=$value" >> "$GITHUB_OUTPUT" ;;
              IMAGE_DIGEST) echo "image-digest=$value" >> "$GITHUB_OUTPUT" ;;
              DURATION_SECONDS) echo "duration-seconds=$value" >> "$GITHUB_OUTPUT" ;;
            esac
          done < "$report"

  verify:
    name: Зафиксировать deployment report
    needs: [build-image, deploy]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Проверить итог deploy job
        env:
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          IMAGE: ${{ needs.build-image.outputs.image }}
          BACKUP: ${{ needs.deploy.outputs.backup }}
          PREVIOUS_IMAGE: ${{ needs.deploy.outputs.previous-image }}
          REVISION: ${{ needs.deploy.outputs.revision }}
          WORKER_STATE: ${{ needs.deploy.outputs.worker-state }}
          POSTGRES_STATE: ${{ needs.deploy.outputs.postgres-state }}
          RUN_ID: ${{ needs.deploy.outputs.run-id }}
          COMPLETED: ${{ needs.deploy.outputs.completed }}
          IMAGE_DIGEST: ${{ needs.deploy.outputs.image-digest }}
          DURATION_SECONDS: ${{ needs.deploy.outputs.duration-seconds }}
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            echo '## Production deployment'
            echo
            echo '| Поле | Значение |'
            echo '|---|---|'
            echo "| Commit SHA | \`${GITHUB_SHA}\` |"
            echo "| Docker image | \`${IMAGE}\` |"
            echo "| Image digest | \`${IMAGE_DIGEST:-не подтверждён}\` |"
            echo "| Previous image | \`${PREVIOUS_IMAGE:-нет}\` |"
            echo "| Backup | \`${BACKUP:-не создан}\` |"
            echo "| Alembic revision | \`${REVISION:-не получена}\` |"
            echo "| Worker | \`${WORKER_STATE:-неизвестно}\` |"
            echo "| PostgreSQL | \`${POSTGRES_STATE:-неизвестно}\` |"
            echo "| Run ID | \`${RUN_ID:-не задан}\` |"
            echo "| Completed | \`${COMPLETED:-неизвестно}\` |"
            echo "| Duration | \`${DURATION_SECONDS:-неизвестно} s\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$DEPLOY_RESULT" = success

  notify-failure:
    name: Уведомить Telegram о сбое
    needs: [quality, build-image, deploy, verify]
    if: >-
      ${{ always() && (
        needs.quality.result != 'success' ||
        needs.build-image.result != 'success' ||
        needs.deploy.result != 'success' ||
        needs.verify.result != 'success'
      ) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: production
    steps:
      - name: Получить exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Установить Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Отправить безопасное failure-уведомление
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FAILED_JOBS: >-
            quality=${{ needs.quality.result }},
            build-image=${{ needs.build-image.result }},
            deploy=${{ needs.deploy.result }},
            verify=${{ needs.verify.result }}
        run: PYTHONPATH=src python -m vk_collector.monitoring.telegram_monitor --workflow-failure
