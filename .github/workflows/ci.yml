name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "chore/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    name: Ruff, mypy и unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходный код
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Установить Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Установить зависимости
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Проверка форматирования
        run: ruff format --check .
      - name: Mypy
        run: mypy src
      - name: Unit tests
        run: >-
          pytest -q tests/unit tests/test_classification_schemas.py tests/test_config.py
          tests/test_cicd_contract.py
      - name: Поиск случайно добавленных секретов
        shell: bash
        run: |
          set -Eeuo pipefail
          forbidden_paths='(^|/)(\.env|secrets|backups)(/|$)|\.dump$|\.manifest\.json$'
          if git ls-files | grep -E "$forbidden_paths"; then
            echo 'В Git найдены запрещённые runtime-файлы.' >&2
            exit 1
          fi
          token_pattern='vk1\.a\.[A-Za-z0-9_-]{20,}|(VK|RUNNER|GITHUB)_TOKEN[[:space:]]*=[[:space:]]*[^$[:space:]]+'
          if git grep -nEI "$token_pattern" -- ':!*.md' ':!tests/**'; then
            echo 'Обнаружено значение, похожее на секрет.' >&2
            exit 1
          fi

  postgres-integration:
    name: PostgreSQL, Alembic и fake VK
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vk_research_test
          POSTGRES_USER: vk_collector
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vk_collector -d vk_research_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      RUN_INTEGRATION_TESTS: "1"
      TZ: UTC
      DATABASE_URL: postgresql+asyncpg://vk_collector:test_password@localhost:5432/vk_research_test
      POSTGRES_DB: vk_research_test
      POSTGRES_USER: vk_collector
      POSTGRES_PASSWORD: test_password
      POSTGRES_READER_USER: vk_reader
      POSTGRES_READER_PASSWORD: test_reader_password
      VK_TOKENS_FILE: /tmp/fake-vk-tokens-not-required
      TELEGRAM_ENABLED: "false"
    steps:
      - name: Получить исходный код
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Установить Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Установить зависимости
        run: python -m pip install -e ".[dev]"
      - name: Применить и проверить миграции
        run: |
          alembic upgrade head
          alembic current
          alembic check
      - name: PostgreSQL integration suite
        run: pytest -q tests/integration/test_postgres_workflow.py
      - name: Fake VK smoke test
        run: pytest -q tests/integration/test_stage2_workflow.py

  compose-smoke:
    name: Изолированный Docker Compose smoke test
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: vk-collector-ci-${{ github.run_id }}-${{ github.run_attempt }}
      APP_ENV: test
      RUN_INTEGRATION_TESTS: "1"
      POSTGRES_DB: vk_research_test
      POSTGRES_USER: vk_collector
      POSTGRES_PASSWORD: test_password
      POSTGRES_READER_USER: vk_reader
      POSTGRES_READER_PASSWORD: test_reader_password
      POSTGRES_BIND_ADDRESS: 127.0.0.1
      POSTGRES_PORT: "55432"
      TELEGRAM_ENABLED: "false"
    steps:
      - name: Получить исходный код
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Подготовить только тестовые bind mounts
        run: "mkdir -p secrets exports && : > secrets/vk_tokens.txt"
      - name: Проверить Compose
        run: docker compose config --quiet
      - name: Собрать образы на GitHub-hosted runner
        run: docker compose build
      - name: Запустить временный PostgreSQL
        run: docker compose up -d postgres
      - name: Миграции и полный тестовый набор в образе
        run: |
          docker compose run --rm collector alembic upgrade head
          docker compose run --rm collector alembic check
          docker compose run --rm collector pytest -q
          docker compose run --rm collector collection summary
      - name: Диагностические логи
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Удалить только временные CI-контейнеры и volume
        if: always()
        run: docker compose down -v --remove-orphans
