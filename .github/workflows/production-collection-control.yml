name: Production collection control

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      action:
        description: report читает; mutations доступны только отдельными manual actions
        required: true
        type: choice
        default: report
        options:
          - report
          - start-subscriptions
          - start-user-posts
          - quarantine-incompatible-pilots
      confirmation:
        description: START_SUBSCRIPTIONS, START_USER_POSTS или QUARANTINE_INCOMPATIBLE_PILOTS
        required: false
        type: string

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  control:
    name: Проверить или запустить production collection
    runs-on: [self-hosted, linux, x64, production, vk-collector]
    timeout-minutes: 360
    environment:
      name: production
    steps:
      - name: Получить проверенный main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Подтвердить commit и действие
        shell: bash
        env:
          CONTROL_ACTION: ${{ github.event_name == 'schedule' && 'report' || inputs.action }}
          CONTROL_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = refs/heads/main
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          case "$CONTROL_ACTION" in
            start-subscriptions)
              test "$GITHUB_EVENT_NAME" = workflow_dispatch
              test "$CONTROL_CONFIRMATION" = START_SUBSCRIPTIONS
              ;;
            start-user-posts)
              test "$GITHUB_EVENT_NAME" = workflow_dispatch
              test "$CONTROL_CONFIRMATION" = START_USER_POSTS
              ;;
            quarantine-incompatible-pilots)
              test "$GITHUB_EVENT_NAME" = workflow_dispatch
              test "$CONTROL_CONFIRMATION" = QUARANTINE_INCOMPATIBLE_PILOTS
              ;;
            report) ;;
            *) exit 2 ;;
          esac
      - name: Выполнить production control
        shell: bash
        env:
          CONTROL_ACTION: ${{ github.event_name == 'schedule' && 'report' || inputs.action }}
          DEPLOY_ROOT: /opt/vk-research-collector
        run: |
          set -Eeuo pipefail
          report="$RUNNER_TEMP/production-collection-${GITHUB_RUN_ID}.log"
          bash scripts/production-collection-control.sh \
            --action "$CONTROL_ACTION" \
            --deploy-dir "$DEPLOY_ROOT" | tee "$report"
          {
            echo '## Production collection control'
            echo
            echo '```text'
            tail -n 240 "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
