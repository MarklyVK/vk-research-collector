name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      SERVER_HOST: ${{ vars.SERVER_HOST }}
      SERVER_PORT: ${{ vars.SERVER_PORT }}
      SERVER_USER: ${{ vars.SERVER_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Настроить SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${SERVER_PORT:-22}" -H "$SERVER_HOST" >> ~/.ssh/known_hosts
      - name: Подготовить runtime-секреты
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_READER_PASSWORD: ${{ secrets.POSTGRES_READER_PASSWORD }}
          VK_TOKENS_B64: ${{ secrets.VK_TOKENS_B64 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          umask 077
          mkdir -p .deploy-secrets
          printf '%s' "$VK_TOKENS_B64" | base64 --decode > .deploy-secrets/vk_tokens.txt
          cat > .deploy-secrets/app.env <<EOF
          APP_ENV=production
          LOG_LEVEL=INFO
          TZ=UTC
          VK_API_VERSION=5.199
          VK_TOKENS_FILE=/run/secrets/vk_tokens.txt
          VK_REQUEST_TIMEOUT_SECONDS=30
          VK_MAX_CONCURRENCY=3
          VK_PER_TOKEN_RPS=2.5
          CLASSIFICATION_BATCH_SIZE=100
          EXPORT_DIR=/app/exports/classification
          POSTGRES_DB=${{ vars.POSTGRES_DB }}
          POSTGRES_USER=${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          POSTGRES_HOST=postgres
          POSTGRES_PORT=${{ vars.POSTGRES_PORT }}
          POSTGRES_READER_USER=vk_reader
          POSTGRES_READER_PASSWORD=$POSTGRES_READER_PASSWORD
          POSTGRES_BIND_ADDRESS=0.0.0.0
          TELEGRAM_ENABLED=true
          TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN
          TELEGRAM_CHAT_ID=$TELEGRAM_CHAT_ID
          DISK_WARNING_PERCENT=85
          DISK_STOP_PERCENT=95
          COLLECTION_WORKER_ID=collector-1
          COLLECTION_MAX_CONCURRENCY=3
          COLLECTION_JOB_LEASE_SECONDS=300
          COLLECTION_JOB_HEARTBEAT_SECONDS=60
          COLLECTION_IDLE_SLEEP_SECONDS=5
          COLLECTION_POSTS_ENABLED=true
          COLLECTION_POSTS_MAX_PER_GROUP=100
          COLLECTION_POSTS_PAGE_SIZE=100
          COLLECTION_MEMBERS_ENABLED=true
          COLLECTION_MEMBERS_MAX_PER_GROUP=200
          COLLECTION_MEMBERS_PAGE_SIZE=1000
          COLLECTION_USERS_ENABLED=true
          COLLECTION_USER_PROFILE_TTL_DAYS=30
          COLLECTION_USER_BATCH_SIZE=1000
          COLLECTION_SUBSCRIPTIONS_ENABLED=false
          COLLECTION_SUBSCRIPTIONS_PAGE_SIZE=500
          COLLECTION_PILOT_SEED=20260728
          COLLECTION_PILOT_GROUPS_PER_CATEGORY=10
          COLLECTION_EXPORT_DIR=/app/exports/stage2-pilot
          EOF
      - name: Передать файлы
        run: |
          ssh -p "${SERVER_PORT:-22}" "$SERVER_USER@$SERVER_HOST" "install -d -m 755 '$DEPLOY_PATH' && install -d -m 700 '$DEPLOY_PATH/secrets'"
          rsync -az --delete --exclude='.git/' --exclude='.env' --exclude='secrets/' --exclude='exports/' -e "ssh -p ${SERVER_PORT:-22}" ./ "$SERVER_USER@$SERVER_HOST:$DEPLOY_PATH/"
          scp -P "${SERVER_PORT:-22}" .deploy-secrets/app.env "$SERVER_USER@$SERVER_HOST:$DEPLOY_PATH/.env"
          scp -P "${SERVER_PORT:-22}" .deploy-secrets/vk_tokens.txt "$SERVER_USER@$SERVER_HOST:$DEPLOY_PATH/secrets/vk_tokens.txt"
      - name: Запустить и проверить
        run: |
          ssh -p "${SERVER_PORT:-22}" "$SERVER_USER@$SERVER_HOST" "cd '$DEPLOY_PATH' && chmod 600 .env secrets/vk_tokens.txt && chmod 700 secrets && docker compose up -d --build postgres && docker compose build collector collector-worker && docker compose run --rm collector alembic upgrade head && docker compose run --rm collector --help >/dev/null && docker compose up -d collector-worker"
      - name: Уведомить Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] && exit 0
          curl --fail --silent --show-error --max-time 10 --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" --data-urlencode "text=VK Research Collector: deploy $JOB_STATUS (${GITHUB_SHA})" "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" >/dev/null
